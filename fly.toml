# fly.toml app configuration file generated for nutri-ambered-silence-6268 on 2026-10-05T10:37:30+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nutri-ambered-silence-6268'
primary_region = 'fra'

[build]
[env]
  DATA_DIR = '/data'
  PORT = '4000'

[[mounts]]
  source = 'nutri_data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
